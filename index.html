<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>ON THE RISE: PB CIRCUIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b; --panel: #121215; --panel-2: #18181b; --line: #27272a; --line-2: #1f1f23;
    --ink: #fafafa; --muted: #a1a1aa; --dim: #71717a;
    --accent: #ef4444; --win: #4ade80; --loss: #f87171; --gold: #e0b44a;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Inter Tight", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .topline { height: 2px; width: 50px; margin: 0 auto; background: var(--accent); }
  .wrap { max-width: 1380px; margin: 0 auto; padding: 0 20px; }
  /* nav */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); padding-top: 14px; }
  .dcbtn { display: inline-flex; align-items: center; gap: 8px; flex: none; margin-bottom: 12px; padding: 7px 14px; border-radius: 8px; background: #5865F2; color: #fff; font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; }
  .dcbtn:hover { background: #4752c4; }
  .dccard { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding: 18px 20px; border-radius: 8px; border: 1px solid rgba(88,101,242,.5); background: linear-gradient(135deg, rgba(88,101,242,.22), rgba(88,101,242,.06)); }
  .dccard .t { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .dccard .d { color: var(--muted); margin-top: 2px; }
  .dccard .dcbtn { margin: 0; padding: 10px 18px; font-size: 14px; }
  @media (max-width: 700px) { #dcTop { align-self: flex-start; } }
  .brand { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; white-space: nowrap; }
  .mark { font-weight: 800; font-size: 19px; letter-spacing: -.04em; line-height: 1; }
  .mark b { color: var(--accent); }
  .brand span { font-weight: 600; font-size: 14px; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { background: none; border: 0; color: var(--muted); font: 500 14px "Inter Tight", sans-serif; padding: 6px 12px 15px; border-bottom: 1px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { color: var(--ink); border-color: var(--ink); }
  .tabs .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  main { padding: 22px 0 60px; }
  /* hero */
  .hero { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; padding: 28px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center;
    background: radial-gradient(900px 300px at 0% 0%, rgba(239, 68, 68, .16), transparent 60%), radial-gradient(700px 300px at 100% 100%, rgba(99, 102, 241, .12), transparent 60%), var(--panel-2); }
  .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .hero h1 { margin: 6px 0 20px; font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -.035em; line-height: 1.02; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; }
  .stat { min-width: 150px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: rgba(9, 9, 11, .45); }
  .stat .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
  .stat .s { font-size: 12px; color: var(--dim); }
  .spot { min-width: 280px; display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(135deg, rgba(224, 180, 74, .16), rgba(224, 180, 74, .02) 70%), var(--panel); }
  .spot img, .spot .ph { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: none; }
  .spot .name { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  .spot .sub { color: var(--muted); font-size: 13px; }
  /* steps strip */
  .steps { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow-x: auto; }
  .step { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 2px solid transparent; }
  .step:last-child { border-right: 0; }
  .step .t { font-weight: 600; font-size: 14px; }
  .step .d { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .step.on { background: linear-gradient(180deg, rgba(239, 68, 68, .14), rgba(239, 68, 68, .04)); border-bottom-color: var(--accent); }
  .step.done .t { color: var(--muted); }
  /* sections */
  .grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; margin-top: 16px; }
  .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 16px; }
  .panel h3, .label { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 4px; }
  .note { color: var(--dim); margin: 0 0 16px; }
  .empty { border: 1px dashed var(--line); border-radius: 8px; padding: 28px; text-align: center; color: var(--dim); }
  /* match cards */
  .m { border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); overflow: hidden; }
  .m + .m { margin-top: 8px; }
  .m.live { border-color: rgba(239, 68, 68, .6); }
  .r { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-weight: 600; }
  .r + .r { border-top: 1px solid var(--line); }
  .r .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r .sc { font-variant-numeric: tabular-nums; font-weight: 700; }
  .r.w .n, .r.w .sc { color: var(--win); }
  .r.l .n, .r.l .sc { color: var(--loss); }
  .r.tbd { color: var(--dim); font-weight: 500; }
  .mhead { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); padding: 6px 12px 0; letter-spacing: .04em; }
  .mhead b { color: var(--accent); font-weight: 600; }
  .bye { padding: 9px 12px; color: var(--dim); font-size: 13px; }
  .lg { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; flex: none; background: var(--line); }
  .ph { display: inline-flex; align-items: center; justify-content: center; background: var(--line); color: var(--muted); font-size: 10px; font-weight: 700; }
  /* bracket */
  .bracket { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; }
  .col { flex: 0 0 240px; display: flex; flex-direction: column; justify-content: space-around; }
  .col > .label { margin-bottom: 8px; }
  .col .m + .m { margin-top: 10px; }
  .sect { margin-top: 26px; }
  .bpic { display: block; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .bpic img { display: block; width: 100%; height: auto; }
  .bpic-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 10px; }
  .livedot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  /* tables */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 0 12px; height: 44px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: rgba(255, 255, 255, .02); }
  td.num, th.num { text-align: right; }
  td.idx { color: var(--dim); width: 36px; }
  .tn { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
  td.heat { text-align: center; font-weight: 600; color: #fff; padding: 0; width: 110px; }
  .tablewrap { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow-x: auto; }
  .toolbar { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 13px; }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 4px; }
  .chip.q { background: rgba(74, 222, 128, .14); color: var(--win); }
  .chip.o { background: rgba(248, 113, 113, .12); color: var(--loss); }
  .chip.in { background: rgba(239, 68, 68, .14); color: #fca5a5; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); width: 140px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .games { margin-top: 12px; }
  .g { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-2); font-size: 13px; }
  .g .who { color: var(--muted); }
  .g .who b { color: var(--win); font-weight: 600; }
  .g .id { color: var(--dim); }
  /* teams */
  .teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .tlist .signed { grid-column: 1 / -1; padding: 10px 0 2px; cursor: default; }
  .entries { display: flex; flex-wrap: wrap; gap: 8px; }
  .entry { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13px; font-weight: 600; max-width: 100%; }
  .entries.notin .entry { opacity: .55; border-style: dashed; }
  .entry img, .entry .ph { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; }
  .seedno { font-size: 12px; font-weight: 700; color: var(--dim); min-width: 18px; }
  .team { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .team .top { display: flex; align-items: center; gap: 12px; padding: 14px; background: linear-gradient(135deg, rgba(255, 255, 255, .04), transparent); border-bottom: 1px solid var(--line); }
  .team .top img, .team .top .ph { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex: none; font-size: 14px; }
  .team .nm { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .team .cap { color: var(--dim); font-size: 12px; }
  .team ul { list-style: none; margin: 0; padding: 8px 14px; }
  .team li { padding: 4px 0; color: var(--muted); font-size: 13px; }
  .team .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .team .pts { font-weight: 800; font-size: 18px; }
  .team .pts small { font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin-left: 4px; }
  /* clickable games + box score */
  .click { cursor: pointer; transition: border-color .15s, background .15s; }
  .m.click:hover { border-color: #52525b; }
  .g.click:hover { background: rgba(255, 255, 255, .03); }
  .m .bx, .g .bx { font-size: 10px; letter-spacing: .06em; color: var(--dim); }

  /* draw cards (like the draw pictures) */
  .dgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .dgroup, .dpair { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .dgroup h4 { margin: 2px 4px 8px; color: var(--accent); font-size: 20px; font-weight: 800; letter-spacing: .02em; }
  .drow { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-radius: 8px; cursor: pointer; min-width: 0; position: relative; }
  .drow:hover { background: rgba(255,255,255,.04); }
  .drow.adv::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 4px; border-radius: 2px; background: var(--accent); }
  .drow img, .drow .ph { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #26262b; }
  .drow .tx { min-width: 0; flex: 1; }
  .drow .nm { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .nm b { color: var(--accent); margin-right: 6px; }
  .drow .st { color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .dpair .vs { display: flex; align-items: center; gap: 10px; color: var(--accent); font-weight: 800; font-size: 12px; margin: 2px 4px; }
  .dpair .vs::before, .dpair .vs::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .dpair .drow.w .nm { color: #4ade80; } .dpair .drow.l { opacity: .55; }
  .pool { margin: 22px 0 10px; color: var(--accent); font-weight: 800; font-size: 18px; letter-spacing: .03em; }
  .rchips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
  .rchips button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; font-weight: 600; }
  .rchips button.on { color: #fff; border-color: var(--accent); }
  /* team popup */
  .tmodal { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: min(560px, 100%); padding: 20px; }
  .tmodal .hd { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .tmodal .hd img, .tmodal .hd .ph { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: #26262b; font-weight: 800; }
  .tmodal .hd .t { font-size: 22px; font-weight: 800; }
  .tmodal .hd .s { color: var(--dim); font-size: 13px; }
  .tmodal ul { list-style: none; margin: 0; padding: 0; }
  .tmodal li { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--line-2); }
  .tmodal li .pos { font-size: 11px; font-weight: 800; color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; min-width: 32px; text-align: center; }
  .tmodal li .badge { font-size: 11px; font-weight: 800; color: #111; background: var(--accent); border-radius: 6px; padding: 1px 6px; }
  .tmodal li a.rbx { margin-left: auto; font-size: 12.5px; font-weight: 700; color: #cfd3ff; text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; white-space: nowrap; }
  .tmodal li a.rbx:hover { border-color: var(--accent); color: #fff; }
  .tmodal .x { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
  .clickteam { cursor: pointer; }
  .clickteam:hover span:last-child, span.n.clickteam:hover { text-decoration: underline; }
  a.rbxname { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--dim); }
  a.rbxname:hover { color: #fff; border-color: var(--accent); }

  /* live games + coming up */
  .livegames { border: 1px solid rgba(239, 68, 68, .45); border-radius: 10px; background: linear-gradient(180deg, rgba(239,68,68,.08), transparent 70%), var(--panel); padding: 12px 14px; margin-bottom: 14px; }
  .livegames h3, .upnext h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; display: flex; align-items: center; gap: 8px; }
  .livegames h3 { color: var(--accent); }
  .livegames h3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
  .zone { border: 1px solid rgba(239, 68, 68, .5); border-radius: 12px; background: linear-gradient(180deg, rgba(239,68,68,.10), transparent 60%), var(--panel); padding: 12px 14px 14px; margin: 0 0 14px; }
  .zone .zh { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .zone .zh h3 { margin: 0; font-size: 12px; letter-spacing: .14em; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .zone .zh h3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
  .zone .zh small { color: var(--dim); font-size: 11.5px; }
  .zgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 10px; }
  .zt { min-width: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); overflow: hidden; }
  .zt.big { grid-column: 1 / -1; order: -1; border-color: rgba(239, 68, 68, .55); }
  .zgrid.solo { max-width: 1000px; margin: 0 auto; }
  @media (min-width: 900px) {  /* RedZone look: the main game big on the left, the rest stacked on the right */
    .zgrid.multi { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); grid-auto-flow: dense; align-items: start; }
    .zgrid.multi .zt { grid-column: 2; }
    .zgrid.multi .zt.big { grid-column: 1; grid-row: 1 / span var(--n, 1); }
  }
  .zt .scr { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .zt .scr iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .zt .cap { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; font-size: 12px; flex-wrap: wrap; }
  .zt .cap .ztm { min-width: 0; font-weight: 700; }
  .zt .cap .ztm small { display: block; font-size: 10px; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
  .zt .cap .zb { display: flex; gap: 6px; align-items: center; }
  .zt .cap button { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; font: 600 11.5px "Inter Tight", sans-serif; padding: 4px 8px; cursor: pointer; }
  .zt.big .cap button.feat { display: none; }
  .zt .cap a { color: var(--muted); font-size: 11.5px; }
  .streamed { font-size: 11.5px; color: var(--muted); text-decoration: none; }
  .streamed:hover { color: var(--ink); text-decoration: underline; }
  .lvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .lvc { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 10px 12px; min-width: 0; }
  .lvc .lvh { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  .lvc .lvt { display: flex; flex-direction: column; gap: 4px; font-weight: 700; min-width: 0; }
  .lvc .lvt .vsx { color: var(--dim); font-size: 11px; font-weight: 700; }
  .lvc .lvf { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .watch { display: inline-flex; align-items: center; gap: 6px; background: #9146ff; color: #fff; border-radius: 6px; padding: 6px 10px; font-weight: 700; font-size: 12.5px; text-decoration: none; white-space: nowrap; }
  .watch:hover { filter: brightness(1.1); }
  .nostream { font-size: 12px; color: var(--dim); }
  .upnext { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 14px; margin-bottom: 14px; }
  .upnext h3 { color: var(--muted); }
  .un { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; min-width: 0; }
  .un:first-of-type { border-top: 0; }
  .un .when { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12.5px; }
  .un .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .un .who small { color: var(--dim); display: block; font-size: 10.5px; letter-spacing: .06em; font-weight: 700; }
  @media (max-width: 560px) { .un { grid-template-columns: 1fr; gap: 6px; } .un .watch { justify-self: start; } }
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .7); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 50; overflow-y: auto; }
  .sheet { width: min(860px, 100%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .sheet .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); background: radial-gradient(600px 160px at 0 0, rgba(239, 68, 68, .14), transparent 60%); }
  .sheet .vs { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 18px; flex-wrap: wrap; }
  .sheet .vs .big { font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .sheet .vs .wcol { color: var(--win); } .sheet .vs .lcol { color: var(--loss); }
  .sheet .x { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; flex: none; }

/* ---- draw view, styled like the draw pictures ---- */

function columns(matches, test) {
  const cols = [];
  for (const m of matches.filter(x => test(x.label))) {
    let c = cols.find(c => c.label === m.label);
    if (!c) cols.push(c = { label: m.label, items: [] });

function nextMatch(d) {

}


/* games: LIVE from tip-off until the result comes in (max 3 hours), with the stream linked */
const LIVE_MS = 3 * 3600 * 1000;
function gameSplit(d) {
  const now = Date.now(), gs = (d && d.games) || [];
  const live = gs.filter(g => { const t = Date.parse(g.time); return t <= now && now < t + LIVE_MS; });
  const soon = gs.filter(g => Date.parse(g.time) > now).slice(0, 6);
  return { live, soon };
}
const fmtTime = iso => new Date(iso).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
function sinceText(iso) {
  const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
  return m < 1 ? "just started" : m < 60 ? `started ${m} min ago` : `started ${Math.floor(m / 60)}h ${m % 60}m ago`;
}
/* streams: which site it's on, and a player we can put on the page (starts muted so it can autoplay) */
function platform(link) {
  const l = String(link || "").toLowerCase();
  return /twitch\.tv/.test(l) ? "Twitch" : /youtube\.com|youtu\.be/.test(l) ? "YouTube" : /kick\.com/.test(l) ? "Kick" : /tiktok\.com/.test(l) ? "TikTok" : "stream";
}
function embedUrl(link) {
  let u; try { u = new URL(link); } catch (e) { return null; }
  const h = u.hostname.replace(/^(www|m)\./, ""), seg = u.pathname.split("/").filter(Boolean);
  if (h === "twitch.tv" && seg[0]) {
    const parents = [...new Set([location.hostname, "ontherisepb.com", "www.ontherisepb.com"].filter(Boolean))].map(p => "parent=" + encodeURIComponent(p)).join("&");
    const what = seg[0] === "videos" && seg[1] ? "video=v" + encodeURIComponent(seg[1]) : "channel=" + encodeURIComponent(seg[0]);
    return `https://player.twitch.tv/?${what}&${parents}&muted=true&autoplay=true`;
  }
  const yt = id => `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=1&playsinline=1`;
  if (h === "youtu.be" && seg[0]) return yt(seg[0]);
  if (h === "youtube.com") {
    if (u.searchParams.get("v")) return yt(u.searchParams.get("v"));
    if (["live", "shorts", "embed"].includes(seg[0]) && seg[1]) return yt(seg[1]);
    if (seg[0] === "channel" && seg[1]) return `https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(seg[1])}&autoplay=1&mute=1`;
  }

}
const streamedLink = r => r && r.link ? `<a class="streamed" href="${esc(r.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Streamed on ${esc(platform(r.link))}${r.stream ? " by " + esc(r.stream) : ""} ↗</a>` : "";
const watchBtn = g => g.tracked && !g.on_air ? `<span class="nostream">📺 ${esc(g.stream)}'s stream isn't live yet</span>`
  : g.link ? `<a class="watch" href="${esc(g.link)}" target="_blank" rel="noopener">${g.on_air ? "🔴 LIVE on " + esc(platform(g.link)) + " · " : "▶ "}Watch ${esc(g.stream || "stream")}</a>`
  : g.stream ? `<span class="nostream">📺 ${esc(g.stream)} is streaming</span>` : `<span class="nostream">No stream yet</span>`;
function liveStrip(d) {
  if (VIEW !== "current") return "";

  const live = gameSplit(d).live.filter(g => !inZone.has(g.id));
  if (!live.length) return "";

    <div class="lvc"><div class="lvh">${esc(g.head)}</div><div class="lvt">${team(g.a)}<span class="vsx">VS</span>${team(g.b)}</div>
    <div class="lvf"><span>${esc(sinceText(g.time))}${g.arena ? ` · ${esc(g.arena)}` : ""}</span>${watchBtn(g)}</div></div>`).join("")}</div></section>`;
}
function upNext(d) {
  if (VIEW !== "current") return "";

    <div class="who"><small>${esc(g.head)}</small>${team(g.a)} <span style="color:var(--dim)">vs</span> ${team(g.b)}</div>${g.stream ? watchBtn(g) : "<span></span>"}</div>`).join("")}</section>`;
}
/* LIVE ZONE: every live game with a stream plays right on the page, the biggest game up top.
   With more than one, it cuts between them every few minutes until you pick one yourself. */
function zoneGames(d) {
  if (!d || d.archived || VIEW !== "current") return [];
  const now = Date.now();
  return ((d.games) || []).filter(g => {
    const t = Date.parse(g.time), live = g.on_air || (t <= now && now < t + LIVE_MS);
    return live && g.link && !(g.tracked && !g.on_air) && embedUrl(g.link);
  });
}
const gameWeight = g => { const h = String(g.head || "").toUpperCase();
  return /GRAND FINAL|^FINAL|\bFINAL\b(?!S)/.test(h) && !/SEMI|QUARTER/.test(h) ? 5 : /SEMI/.test(h) ? 4 : /QUARTER/.test(h) ? 3 : /ROUND|MAIN/.test(h) ? 2 : 1; };
const ZONE = { key: "", feat: null, pinned: false, last: 0 };
function feature(id) {
  ZONE.feat = id; ZONE.last = Date.now();
  document.querySelectorAll("#zone .zt").forEach(t => t.classList.toggle("big", Number(t.dataset.zid) === id));
}
function updateZone() {
  const el = document.getElementById("zone");
  if (!el) return;
  const gs = zoneGames(window.__view || D);
  const key = gs.map(g => g.id + "|" + g.link).join(",");
  if (!gs.length) { el.hidden = true; el.innerHTML = ""; ZONE.key = ""; return; }
  if (key !== ZONE.key) {  // only rebuild when games come or go, so players already running keep playing
    const keep = new Map([...el.querySelectorAll(".zt")].map(t => [t.dataset.zid + "|" + t.dataset.zl, t]));
    if (!gs.some(g => g.id === ZONE.feat)) { ZONE.feat = [...gs].sort((a, b) => gameWeight(b) - gameWeight(a) || Date.parse(a.time) - Date.parse(b.time))[0].id; ZONE.pinned = false; ZONE.last = Date.now(); }
    el.innerHTML = `<div class="zh"><h3><i></i>LIVE ZONE · ${gs.length} GAME${gs.length > 1 ? "S" : ""} ON NOW</h3><small>Starts muted. Click the player for sound.${gs.length > 1 ? " Switches games every few minutes until you pick one." : ""}</small></div><div class="zgrid ${gs.length > 1 ? "multi" : "solo"}" style="--n:${Math.max(1, gs.length - 1)}"></div>`;
    const grid = el.querySelector(".zgrid");

      const old = keep.get(g.id + "|" + g.link);
      if (old) { grid.appendChild(old); return; }  // moving it would reload it anyway, but this keeps the caption current
      const t = document.createElement("div");
      t.className = "zt"; t.dataset.zid = g.id; t.dataset.zl = g.link;
      t.innerHTML = `<div class="scr"><iframe src="${esc(embedUrl(g.link))}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen loading="lazy" title="${esc(g.a + " vs " + g.b)}"></iframe></div>
        <div class="cap"><div class="ztm"><small>${esc(g.head)}</small>${esc(g.a)} vs ${esc(g.b)}</div><div class="zb"><button class="feat" data-zfeat="${g.id}">Watch this one</button><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(platform(g.link))}${g.stream ? " · " + esc(g.stream) : ""} ↗</a></div></div>`;
      grid.appendChild(t);
    });

document.getElementById("zone").addEventListener("click", e => { const b = e.target.closest("[data-zfeat]"); if (b) { ZONE.pinned = true; feature(Number(b.dataset.zfeat)); } });
setInterval(() => {  // the RedZone cut: next live game, biggest games first
  const gs = zoneGames(window.__view || D);

/* TICKER: live games, then the latest finals, then what's coming up. Built again only when something changes,

let TICK_KEY = "";
function updateTicker() {

function download(name, rows) {

let STAT_SCOPE = "tournament", STAT_SORT = "ppg";

}
const SCOLS = [["gp", "GP", "n"], ["ppg", "PPG", "h"], ["rpg", "RPG", "h"], ["apg", "APG", "h"], ["spg", "SPG", "h"],

/* search (players + teams) */
let SQ = [], SQ_HI = -1;
function runSearch() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const box = document.getElementById("sres");
  if (!q || !D) { box.hidden = true; SQ = []; return; }
  const ts = (D.teams || []).filter(t => t.name.toLowerCase().includes(q)).slice(0, 5).map(t => ({ k: "t", n: t.name, t }));
  const ps = PLAYERS().filter(p => p.name.toLowerCase().includes(q) || p.rbx.toLowerCase().includes(q))
    .sort((a, b) => a.name.toLowerCase().indexOf(q) - b.name.toLowerCase().indexOf(q)).slice(0, 8).map(p => ({ k: "p", n: p.name, p }));
  SQ = [...ts, ...ps]; SQ_HI = SQ.length ? 0 : -1;
  const row = (r, i) => r.k === "t"
    ? `<button data-si="${i}" class="${i === SQ_HI ? "hi" : ""}">${r.t.logo ? `<img src="${esc(r.t.logo)}" alt="">` : `<span class="ph">${esc(initials(r.n))}</span>`}<span>${esc(r.n)}</span><span class="sm">${r.t.points} RP</span></button>`
    : `<button data-si="${i}" class="${i === SQ_HI ? "hi" : ""}">${pimg(r.p)}<span>${esc(r.n)}${!r.n.toLowerCase().includes(r.p.rbx.toLowerCase()) ? ` <span style="color:var(--dim)">(${esc(r.p.rbx)})</span>` : ""}</span><span class="sm">${r.p.team ? esc(r.p.team) : r.p.fa ? "Free agent" : ""}${r.p.pos ? " · " + esc(r.p.pos) : ""}</span></button>`;
  box.innerHTML = SQ.length ? (ts.length ? `<div class="grp">TEAMS</div>` + ts.map((r, i) => row(r, i)).join("") : "")
    + (ps.length ? `<div class="grp">PLAYERS</div>` + ps.map((r, i) => row(r, i + ts.length)).join("") : "")
    : `<div class="none">No players or teams match “${esc(q)}”.</div>`;
  box.hidden = false;
}
function pickSearch(i) {
  const r = SQ[i]; if (!r) return;
  document.getElementById("sres").hidden = true; document.getElementById("q").blur();

}
document.getElementById("q").addEventListener("input", runSearch);
document.getElementById("q").addEventListener("focus", runSearch);
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!SQ.length) return; SQ_HI = (SQ_HI + (e.key === "ArrowDown" ? 1 : -1) + SQ.length) % SQ.length;
    document.querySelectorAll("#sres [data-si]").forEach(b => b.classList.toggle("hi", Number(b.dataset.si) === SQ_HI)); }

document.getElementById("q").addEventListener("blur", () => setTimeout(() => { document.getElementById("sres").hidden = true; }, 120));

/* ---- countdown to the next thing ---- */
const CD_ICON = { draw: "🎥", signups: "📝", main: "🏆", matches: "🏀", game: "🏀", other: "📣" };
const CD_KIND = { draw: "Live draw", signups: "Entries close in", main: "Main draw starts in", matches: "Games due in", game: "Next game", other: "Coming up" };
const fmtLong = iso => new Date(iso).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
function relTime(t) {
  const s = Math.round((t - Date.now()) / 1000), a = Math.abs(s);
  const txt = a < 3600 ? `${Math.max(1, Math.round(a / 60))} min` : a < 86400 ? `${Math.round(a / 3600)} hr` : `${Math.round(a / 86400)} day${Math.round(a / 86400) > 1 ? "s" : ""}`;
  return s >= 0 ? "in " + txt : txt + " ago";
}
function nextUp(d) {
  const now = Date.now();
  const evs = (d.events || []).map(e => ({ ...e, t: new Date(e.at).getTime() })).filter(e => e.live || e.t > now);
  const g = (((d.schedule || {}).games) || []).filter(x => x.time && new Date(x.time).getTime() > now)
    .sort((a, b) => a.time.localeCompare(b.time))[0];
  if (g) evs.push({ kind: "game", label: `${g.a} vs ${g.b}`, at: g.time, t: new Date(g.time).getTime(), where: g.head + (g.stream ? ` · 📺 ${g.stream} streaming` : "") });
  const live = evs.find(e => e.live);
  return live || evs.sort((a, b) => a.t - b.t)[0] || null;
}
function clockHTML(t) {
  let s = Math.max(0, Math.floor((t - Date.now()) / 1000));
  const parts = [[Math.floor(s / 86400), "DAYS"], [Math.floor(s % 86400 / 3600), "HRS"], [Math.floor(s % 3600 / 60), "MIN"], [s % 60, "SEC"]];
  return parts.map(([v, l]) => `<div><b>${String(v).padStart(2, "0")}</b><small>${l}</small></div>`).join("");
}
function countdownBar(d) {
  if (VIEW !== "current") return "";
  const e = nextUp(d);
  if (!e) return "";
  const live = !!e.live;
  return `<section class="cd ${live ? "live" : ""}" ${live ? "" : `data-cdat="${e.t}"`} aria-label="Next up"><span class="ico">${CD_ICON[e.kind] || "📣"}</span>
    <div style="min-width:0"><div class="k">${live ? "LIVE NOW · in Discord" : CD_KIND[e.kind] || "Next up"}</div><div class="t">${esc(e.label)}</div>
    <div class="s">${live ? "Seeds, groups and first opponents are being revealed right now." : esc(fmtLong(e.at))}${e.where ? " · " + esc(e.where) : ""}${e.note ? " · " + esc(e.note) : ""}</div></div>
    ${live ? `<a class="dcbtn" style="margin:0" href="${DISCORD_URL}" target="_blank" rel="noopener">Watch in Discord</a>` : `<div class="clock">${clockHTML(e.t)}</div>`}</section>`;
}
setInterval(() => {
  document.querySelectorAll("[data-cdat]").forEach(el => {
    const t = Number(el.dataset.cdat);
    if (t <= Date.now()) { const bar = document.getElementById("cdbar"); if (bar && D) bar.innerHTML = countdownBar(window.__view || D); return; }
    const c = el.querySelector(".clock"); if (c) c.innerHTML = clockHTML(t);
  });
}, 1000);

/* ---- schedule ---- */
function dayLabel(dt) {
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const d1 = new Date(dt); d1.setHours(0, 0, 0, 0);
  const diff = Math.round((d1 - d0) / 86400000);
  return diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" : dt.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
}
function scheduleView(d) {
  const sc = d.schedule || { games: [], recent: [] };
  const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || "your timezone";
  const now = Date.now();
  let html = `<h2>Schedule</h2><p class="note">Every time is shown in your timezone (${esc(tzName.replace(/_/g, " "))}). Captains set game times in Discord with <b>/gametime</b>.</p>`;
  const evs = (d.events || []);
  if (evs.length) html += `<div class="panel"><h3>Coming up</h3>${evs.map(e => `<div class="evrow"><span style="font-size:18px">${CD_ICON[e.kind] || "📣"}</span>
    <div style="min-width:0"><b>${esc(e.label)}</b>${e.where || e.note ? `<div style="color:var(--dim);font-size:12.5px">${esc([e.where, e.note].filter(Boolean).join(" · "))}</div>` : ""}</div>
    <span class="when">${e.live ? '<b style="color:var(--accent)">LIVE NOW</b>' : esc(fmtLong(e.at)) + "<br>" + esc(relTime(new Date(e.at).getTime()))}</span></div>`).join("")}</div>`;
  const timed = sc.games.filter(g => g.time), waiting = sc.games.filter(g => !g.time);
  const gameRow = g => {
    const t = new Date(g.time).getTime(), live = t <= now && now - t < LIVE_MS;
    return `<div class="sg ${live ? "live" : ""}"><div class="tm">${live ? "LIVE" : esc(new Date(g.time).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }))}<small>${live ? esc(sinceText(g.time)) : esc(relTime(t))}</small></div>
      <div class="who"><small>${esc(g.head)}</small><div class="vs">${team(g.a)}<em>vs</em>${team(g.b)}</div></div>
      <div class="side">${g.stream ? watchBtn(g) : '<span>No stream claimed</span>'}${g.arena ? `<span>🏟️ ${esc(g.arena)}</span>` : ""}</div></div>`;
  };
  if (timed.length) {
    const days = [];
    timed.forEach(g => { const l = dayLabel(new Date(g.time)); const day = days.find(x => x[0] === l); day ? day[1].push(g) : days.push([l, [g]]); });
    html += days.map(([l, gs]) => `<div class="sday"><h3>${esc(l)} · ${plural(gs.length, "game")}</h3>${gs.map(gameRow).join("")}</div>`).join("");
  }
  if (waiting.length) {
    const pre = sc.preset || { time: "20:00", tz: "ET" };
    const [hh, mm] = pre.time.split(":").map(Number);
    const preTxt = `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, "0")} ${hh < 12 ? "AM" : "PM"} ${pre.tz}`;
    html += `<div class="sday"><h3>Waiting for a game time · ${waiting.length}</h3><p class="note" style="margin:-2px 0 10px">Captains agree a time before each game's deadline. If they don't, the bot picks one and staff confirm it (evenings from ${esc(preTxt)}, every 30 minutes, spread out so games don't start at the same time).${sc.stage_end ? ` This stage has to be finished by ${esc(fmtLong(sc.stage_end))}.` : ""}</p>
      ${waiting.map(g => `<div class="sg"><div class="tm">TBD<small>${g.deadline ? "agree by " + esc(new Date(g.deadline).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })) : "not set"}</small></div>
        <div class="who"><small>${esc(g.head)}</small><div class="vs">${team(g.a)}<em>vs</em>${team(g.b)}</div></div><div class="side"><span>${g.deadline ? esc(relTime(new Date(g.deadline).getTime())) : ""}</span></div></div>`).join("")}</div>`;
  }
  if (!sc.games.length && !evs.length) html += `<div class="empty">Nothing scheduled right now. The next tournament will be announced in Discord.</div>`;
  const rec = (sc.recent || []).map(r => ({ ...r, m: MATCHES[r.id] })).filter(r => r.m && r.m.winner);
  const rec0 = id => (sc.recent || []).find(r => r.id === id);
  if (rec.length) html += `<div class="sday"><h3>Recent results</h3>${rec.map(({ m, time, head }) => {
    const loser = m.winner === m.a ? m.b : m.a, has = m.box && m.box.length;
    return `<div class="sg res ${has ? "click" : ""}" ${has ? `data-mid="${m.id}" style="cursor:pointer"` : ""}><div class="tm">FINAL<small>${time ? esc(new Date(time).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })) : ""}</small></div>
      <div class="who"><small>${esc(head)}</small><div class="vs"><span class="w">${team(m.winner)}</span><em>beat</em><span class="l">${team(loser)}</span></div></div>
      <div class="side"><b style="font-size:15px;color:var(--ink)">${esc(m.score || "")}</b>${has ? '<span class="bx" style="font-size:11px">BOX SCORE</span>' : ""}${streamedLink(rec0(m.id))}</div></div>`; }).join("")}</div>`;
  return html;
}

/* ---- rules ---- */
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/(^|\s)\*([^*]+)\*/g, "$1<i>$2</i>");
function placeName(k) { const [a, b] = k.split("-").map(Number); const o = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th"); return b ? `${o(a)}–${o(b)}` : o(a); }
function rulesView(d) {
  const r = d.rules;
  if (!r) return `<h2>Rules</h2><div class="empty">The rules will show here once the bot updates the website.</div>`;
  const slug = s => "r-" + s.toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-|-$/g, "");
  const title = t => t.replace(/^[^A-Za-z]+/, "");
  const rpCard = r.cards.find(c => /RISER POINTS/i.test(c.title));  // shown inside the points card, not twice
  const cards = r.cards.filter(c => c !== rpCard);
  const pts = String(r.points || "").split(" · ").map(x => x.trim().split(": ")).filter(x => x.length === 2);
  const facts = [["Major target", r.target != null ? r.target : "TBA", "RISER POINTS to qualify"], ["LCQ", `Next ${r.lcq_invites}`, `teams invited · top ${r.lcq_spots} go to the Major`],
    ["Champion", pts.length ? pts[0][1] : "—", "RISER POINTS for 1st"], ["Rosters", "5–8", "players, captain included"]];
  return `<h2>Rules</h2><p class="note">The full ON THE RISE rulebook. The same rules are posted in Discord. Questions? Open a ticket there.</p>
    <div class="stats">${facts.map(([k, v, s]) => `<div class="stat"><div class="k">${k}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`).join("")}</div>
    <div class="rjump"><a href="#r-settings">Game settings</a><a href="#r-report">Reporting scores</a><a href="#r-points">RISER POINTS and Majors</a>${cards.map(c => `<a href="#${slug(title(c.title))}">${esc(title(c.title))}</a>`).join("")}</div>
    <div class="rgrid">
      <div class="rcard" id="r-settings" style="grid-column:1/-1"><h3>🏀 Game settings</h3><p class="note" style="margin:0 0 10px">Set every league game up like this before tip-off. Wrong settings? Restart before the first basket, or the result stands.</p>
        <div class="settings">${r.settings.map(([k, v]) => `<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join("")}</div></div>
      <div class="rcard" id="r-report"><h3>📊 Reporting the score</h3><ol>${r.report.map(x => `<li>${md(x)}</li>`).join("")}</ol></div>
      <div class="rcard" id="r-points"><h3>⭐ RISER POINTS and Majors</h3>${rpCard ? `<ol style="margin-bottom:14px">${rpCard.items.map(x => `<li>${md(x)}</li>`).join("")}</ol>` : ""}${pts.length ? `<table><tbody>${pts.map(([k, v]) => `<tr><td>${esc(k.replace("-", "–"))}</td><td class="num"><b>${esc(v)}</b></td></tr>`).join("")}</tbody></table>` : '<p class="note">Posted when entries open.</p>'}
        <p class="note" style="margin:10px 0 0">Last place in the main draw always gets ${r.cons_gap} more points than the consolation bracket winner.</p></div>
      ${cards.map(c => `<div class="rcard" id="${slug(title(c.title))}"><h3>${esc(c.title)}</h3><ol>${c.items.map(x => `<li>${md(x)}</li>`).join("")}</ol>
        ${/suspension/i.test(c.title) && r.suspensions ? `<p class="note" style="margin:12px 0 0"><b style="color:var(--ink)">Director of Enforcement:</b> ${esc(r.suspensions.enforcement.join(", "))}.<br><b style="color:var(--ink)">League Staff:</b> ${esc(r.suspensions.staff.join(", "))}.</p>` : ""}</div>`).join("")}
    </div>`;
}

/* ---- media: what the bot (and Media members) post in Discord ---- */
let MEDIA_SEC = "all";
const mdb = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>").replace(/\n/g, "<br>");
const ago = iso => { if (!iso) return ""; const d = (Date.now() - new Date(iso)) / 1000; return d < 3600 ? `${Math.max(1, Math.round(d / 60))} min ago` : d < 86400 ? `${Math.round(d / 3600)} hr ago` : new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" }); };
function prView(pr) {
  if (!pr || !pr.rows) return '<div class="empty">Power rankings post automatically after the qualifier and after the final.</div>';
  const mv = m => !m ? "" : m.startsWith("▲") ? `<span class="mv up">${esc(m)}</span>` : m.startsWith("▼") ? `<span class="mv dn">${esc(m)}</span>` : m === "=" ? '<span class="mv eq">=</span>' : '<span class="mv nw">NEW</span>';
  return `<div class="pr"><div class="pr-head"><h3>${esc(pr.title)}</h3><ul>${(pr.recap || []).map(x => `<li>${mdb(x)}</li>`).join("")}</ul><div class="meta2" style="margin-top:6px;color:var(--dim)">${esc(ago(pr.at))}</div></div>
    ${pr.rows.map(r => `<div class="prrow"><div class="prk">${r.rank}</div>${logo(r.team, "")}<div style="min-width:0">
      <div class="tn3"><span class="clickteam" data-team="${esc(r.team)}" style="cursor:pointer">${esc(r.team)}</span>${mv(r.move)}${r.place ? `<span class="chip q">${esc(r.place)}</span>` : ""}</div>
      <div class="meta2">${esc(r.record)} · ${r.pd > 0 ? "+" : ""}${r.pd} PD/game${r.best_win ? " · " + esc(r.best_win) : ""}</div>
      ${r.star ? `<div class="meta2">⭐ <button class="plink" data-player="${esc(r.star.name)}">${esc(r.star.name)}</button>: ${r.star.ppg} PPG · ${r.star.rpg} RPG · ${r.star.apg} APG</div>` : ""}
      ${r.story ? `<div class="story">${mdb(r.story)}</div>` : ""}</div></div>`).join("")}</div>`;
}
function anCard(a) {
  const has = MATCHES[a.id] && MATCHES[a.id].box && MATCHES[a.id].box.length;
  return `<div class="an"><div class="hd2"><div><small>${esc(a.head)}${a.tournament ? " · " + esc(a.tournament) : ""}</small>
      <div class="vs2">${team(a.a)} <span style="color:var(--dim)">vs</span> ${team(a.b)}</div></div>
      <div style="text-align:right"><div class="sc2">${esc(a.score || "")}</div>${has ? `<button class="btn" data-mid="${a.id}" style="margin-top:4px">Box score</button>` : ""}</div></div>
    <p>${mdb(a.text)}</p><div class="meta2" style="color:var(--dim);font-size:12px;margin-top:8px">${esc(ago(a.at))}</div></div>`;
}
function vidCard(p) {
  const thumb = p.image || (p.yt ? `https://img.youtube.com/vi/${p.yt}/hqdefault.jpg` : "");
  const th = p.yt ? `<span class="th" data-yt="${esc(p.yt)}" style="background-image:url('${esc(thumb)}')"></span>`
    : thumb ? `<a class="th" href="${esc(p.link || thumb)}" target="_blank" rel="noopener" style="background-image:url('${esc(thumb)}')"></a>` : "";
  return `<div class="vid">${th}<div class="body"><div class="t">${p.link && !p.yt ? `<a href="${esc(p.link)}" target="_blank" rel="noopener" style="color:inherit">${esc(p.title)}</a>` : esc(p.title)}</div>
    ${p.desc ? `<div class="d">${mdb(p.desc)}</div>` : ""}<div class="by">${esc(p.by || "")} · ${esc(ago(p.at))}</div></div></div>`;
}
function mediaView(d) {
  const m = d.media || {};
  const posts = m.posts || [];
  const reports = posts.filter(p => p.kind === "report"), vids = posts.filter(p => p.kind === "yt"), gfx = posts.filter(p => p.kind === "gfx");
  const secs = [["all", "All"], ["rankings", "Power rankings"], ["analysis", "Game analysis"], ["report", "OTR Report"], ["yt", "Highlights"], ["gfx", "Official GFX"]];
  const show = k => MEDIA_SEC === "all" || MEDIA_SEC === k;
  let html = `<h2>Media</h2><p class="note">The same coverage that goes out in the ON THE RISE Discord: power rankings, a breakdown of every game, the OTR Report, highlights and official graphics.</p>
    <div class="rchips">${secs.map(([k, l]) => `<button data-msec="${k}" class="${MEDIA_SEC === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  if (show("rankings")) html += `<div class="msec"><h3>Power rankings</h3>${prView(m.rankings)}</div>`;
  if (show("analysis")) html += `<div class="msec"><h3>Game analysis</h3>${(m.analysis || []).length ? `<div class="mgrid" style="grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr))">${m.analysis.map(anCard).join("")}</div>` : '<div class="empty">A breakdown is written for every game once its stats are in.</div>'}</div>`;
  if (show("report")) html += `<div class="msec"><h3>The OTR Report</h3>${reports.length ? `<div class="mgrid">${reports.map(vidCard).join("")}</div>` : '<div class="empty">No episodes yet.</div>'}</div>`;
  if (show("yt")) html += `<div class="msec"><h3>Highlights</h3>${vids.length ? `<div class="mgrid">${vids.map(vidCard).join("")}</div>` : '<div class="empty">No highlight videos yet.</div>'}</div>`;
  if (show("gfx")) html += `<div class="msec"><h3>Official GFX</h3>${gfx.length ? `<div class="mgrid">${gfx.map(p => `<a class="gfx" href="${esc(p.image)}" target="_blank" rel="noopener"><img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy"><div class="body">${esc(p.title)}</div></a>`).join("")}</div>` : '<div class="empty">No official graphics yet.</div>'}</div>`;
  return html;
}
document.addEventListener("click", e => {
  const y = e.target.closest("[data-yt]");
  if (!y) return;
  y.outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(y.dataset.yt)}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
});

function render() {
  const raw = window.PBL_DATA;
  const view = document.getElementById("view");
  if (!raw) { view.innerHTML = '<div class="empty">No circuit data yet. Staff can run /website in Discord.</div>'; return; }
  D = raw;
  if (VIEW !== "current" && !(D.tournaments || []).some(t => t.id === VIEW)) VIEW = "current";
  const d = viewData();
  LOGOS = {};
  Object.assign(LOGOS, (d.archived && d.logos) || {});
  (D.teams || []).forEach(t => { if (t && t.logo) LOGOS[t.name] = t.logo; });
  picker();
  document.title = (d.archived ? d.tourney.name + " · " : "") + (D.league || "ON THE RISE: PB CIRCUIT");
  document.getElementById("updated").textContent = d.updated ? "updated " + new Date(d.updated).toLocaleString() : "";
  MATCHES = {};
  [...(d.main ? d.main.matches : []), ...(d.consolation ? d.consolation.matches : []), ...(d.tourney && d.tourney.lcq && d.tourney.lcq.playin ? d.tourney.lcq.playin.matches : []), ...(d.swiss ? d.swiss.matches : []), ...(d.groups ? d.groups.list.flatMap(g => g.matches) : [])]
    .forEach(m => { MATCHES[m.id] = m; });
  const live = !d.archived && d.main ? d.main.matches.filter(m => m.ready).length : 0;
  const tabs = [["overview", "Overview"]];
  const ents = entryTeams(d);
  if (ents) tabs.push(["entries", "Entries", ents.length]);
  if (d.groups || d.swiss || d.main) tabs.push(["draw", "Draw"]);
  if (!d.archived) tabs.push(["schedule", "Schedule", gameSplit(d).live.length]);
  tabs.push(["pickups", "Ranked"], ["bracket", "Main draw", live]);
  if (d.swiss || d.groups) tabs.push(["qual", d.swiss ? "Swiss stage" : "Groups"]);
  tabs.push(["points", "RISER POINTS"], ["stats", "Stats"], ["leaderboard", "Leaderboard"], ["teams", "Teams"]);
  const faN = (D.players || []).filter(p => p.fa && !p.suspended).length;
  tabs.push(["fa", "Free agents", faN], ["media", "Media"], ["rules", "Rules"]);
  if (!tabs.some(t => t[0] === tab)) tab = "overview";
  window.__view = d;
  document.getElementById("tabs").innerHTML = tabs.map(([k, l, n]) => `<button class="${k === tab ? "on" : ""}" data-k="${k}">${l}${n ? `<span class="count">${n}</span>` : ""}</button>`).join("");
  view.innerHTML = `<div id="cdbar">${countdownBar(d)}</div><div id="livestrip">${liveStrip(d)}</div>` + (tab === "schedule" ? scheduleView(d) : tab === "fa" ? faView(d) : tab === "media" ? mediaView(d) : tab === "rules" ? rulesView(d) : tab === "draw" ? drawView(d) : tab === "entries" ? entriesView(d) : tab === "bracket" ? bracketView(d) : tab === "qual" ? qualifierView(d) : tab === "points" ? pointsView(d) : tab === "stats" ? statsView(d) : tab === "pickups" ? pickupsView(d) : tab === "leaderboard" ? leaderboardView(d) : tab === "teams" ? teamsView(d) : overview(d));
  updateZone();
  updateTicker();
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  tab = b.dataset.k;
  try { localStorage.setItem("otr-tab", tab); } catch (err) {}
  render();
});

document.getElementById("view").addEventListener("click", e => {
  const swr = e.target.closest("[data-swround]");
  if (swr) { SW_ROUND = Number(swr.dataset.swround); return render(); }
  const g = e.target.closest("[data-mid]");
  if (g) return openBox(Number(g.dataset.mid));
  const sc = e.target.closest("[data-scope]");
  if (sc) { STAT_SCOPE = sc.dataset.scope; return render(); }
  if (e.target.closest("[data-csv=stats]")) return exportStats(window.__view || D);
  const k = e.target.closest("[data-k]");
  if (k) { tab = k.dataset.k; if (k.closest(".signed") && VIEW !== "current") return setView("current"); return render(); }
  if (e.target.closest(".signed")) return;  // the signed-up list inside a tournament row
  const v = e.target.closest("[data-view]");
  if (v) return setView(v.dataset.view);
  const lr = e.target.closest("[data-lbrank]");
  if (lr) { LB_RANK = lr.dataset.lbrank === LB_RANK ? "all" : lr.dataset.lbrank; return render(); }
  const lp = e.target.closest("[data-lbpos]");
  if (lp) { LB_POS = lp.dataset.lbpos; return render(); }
  const ms = e.target.closest("[data-msec]");
  if (ms) { MEDIA_SEC = ms.dataset.msec; return render(); }
  const fp = e.target.closest("[data-fapos]");
  if (fp) { FA_POS = fp.dataset.fapos; return render(); }
  const fs = e.target.closest("[data-fasort]");
  if (fs) { FA_SORT = fs.dataset.fasort; return render(); }
  const so = e.target.closest("[data-sort]");
  if (so) { STAT_SORT = so.dataset.sort; return render(); }
});

document.getElementById("view").addEventListener("input", e => {
  if (e.target.id === "lbq") { LB_Q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("lbq"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
});
document.getElementById("view").addEventListener("change", e => { if (e.target.id === "lbsort") { LB_SORT = e.target.value; render(); } });
document.getElementById("tbar").addEventListener("change", e => { if (e.target.id === "tsel") setView(e.target.value); });
document.getElementById("tbar").addEventListener("click", e => { const v = e.target.closest("[data-view]"); if (v) setView(v.dataset.view); });

function load() {
  const s = document.createElement("script");
  s.src = "data.js?t=" + Date.now();
  s.onload = s.onerror = () => {
    s.remove();
    if (tab === "media" && document.querySelector("#view .vid iframe")) return;  // don't cut off a video that's playing
    render();
    if (!window.__hashDone && /^#(ranked|queue|leaderboard|bracket|schedule|freeagents|rules|media)$/.test(location.hash)) { window.__hashDone = true; tab = { "#leaderboard": "leaderboard", "#bracket": "bracket", "#schedule": "schedule", "#freeagents": "fa", "#rules": "rules", "#media": "media" }[location.hash] || "pickups"; render(); return; }
    const hm = !window.__hashDone && location.hash.match(/^#m(\d+)$/);  // link from a Discord score card
    window.__hashDone = true;
    if (hm && MATCHES[Number(hm[1])]) { tab = MATCHES[Number(hm[1])].label ? "bracket" : (D.swiss || D.groups) ? "qual" : tab; render(); openBox(Number(hm[1])); }
  };
  document.head.appendChild(s);
}
load();
setInterval(() => { if (!document.hidden) load(); }, 20000);  // the ranked queue changes often
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
