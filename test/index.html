<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON THE RISE: PB CIRCUIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #17181c; --muted: #6b6e76; --line: #e3e0da;
    --accent: #e8590c; --accent-soft: #fff1e8; --win: #1f7a4d; --win-soft: #e8f5ee; --out: #a7a9ad;
    --head: #17181c; --head-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111216; --panel: #1b1d23; --ink: #eceef2; --muted: #9a9ea8; --line: #2c2f37;
      --accent: #ff7a2f; --accent-soft: #2e1f16; --win: #4cc38a; --win-soft: #16291f; --out: #5b5e66;
      --head: #0b0c0f; --head-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; }
  header { background: var(--head); color: var(--head-ink); padding: 28px 16px 0; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { font-family: "Barlow Condensed", sans-serif; font-size: clamp(34px, 6vw, 56px); line-height: 1; margin: 6px 0 10px; letter-spacing: .01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: #b9bcc4; font-size: 13px; }
  .pill { background: var(--accent); color: #fff; border-radius: 999px; padding: 3px 10px; font-weight: 600; font-size: 12px; }
  nav { display: flex; gap: 4px; margin-top: 22px; overflow-x: auto; }
  nav button { background: none; border: 0; color: #b9bcc4; font: 600 14px Inter, sans-serif; padding: 12px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  nav button.on { color: #fff; border-color: var(--accent); }
  main { padding: 24px 16px 64px; }
  .champ { background: linear-gradient(135deg, var(--accent), #f59f00); color: #fff; border-radius: 14px; padding: 20px 22px; margin-bottom: 24px; }
  .champ small { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 600; opacity: .9; }
  .champ div { font-family: "Barlow Condensed", sans-serif; font-size: 40px; line-height: 1.05; }
  h2 { font-family: "Barlow Condensed", sans-serif; font-size: 28px; margin: 28px 0 12px; }
  h2:first-child { margin-top: 0; }
  .note { color: var(--muted); margin: -6px 0 14px; font-size: 14px; }
  .empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); }
  /* bracket */
  .bracket { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x proximity; }
  .col { flex: 0 0 220px; display: flex; flex-direction: column; justify-content: space-around; gap: 12px; scroll-snap-align: start; }
  .col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 2px; font-weight: 600; }
  .match { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .match.ready { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .match .id { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 5px 10px 0; }
  .match .id b { color: var(--accent); font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .t { overflow: hidden; white-space: nowrap; min-width: 0; }
  .row.tbd .t { color: var(--muted); font-style: italic; }
  .row.w { background: var(--win-soft); font-weight: 600; }
  .row.w .nm::after { content: " \2713"; color: var(--win); }
  .row.l .nm { color: var(--out); text-decoration: line-through; }
  .row.l .lg { opacity: .45; }
  .row .s { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bye { font-size: 13px; color: var(--muted); padding: 8px 10px; }
  /* tables */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 8px; }
  .card h3 { margin: 0 0 8px; font-family: "Barlow Condensed", sans-serif; font-size: 22px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; width: 44px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
  .tag.q { background: var(--win-soft); color: var(--win); }
  .tag.o { background: var(--line); color: var(--muted); }
  .games { margin-top: 10px; display: grid; gap: 6px; }
  .game { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .game .who b { color: var(--win); }
  .game .id { color: var(--muted); white-space: nowrap; }
  .rounds { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  ul.teams { columns: 220px; padding: 0; list-style: none; margin: 0; }
  ul.teams li { padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; break-inside: avoid; }
  .lg { width: 22px; height: 22px; border-radius: 6px; object-fit: cover; flex: none; vertical-align: middle; margin-right: 8px; background: var(--line); }
  .ph { display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--muted); }
  .row .t { display: flex; align-items: center; }
  .row .t .nm { overflow: hidden; text-overflow: ellipsis; }
  td .tn { display: inline-flex; align-items: center; }
  .champ { display: flex; align-items: center; gap: 18px; }
  .champ img { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; background: rgba(255,255,255,.2); }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; }
  .tcard img, .tcard .big { width: 96px; height: 96px; border-radius: 16px; object-fit: cover; display: block; margin: 0 auto 10px; background: var(--line); }
  .tcard .big { display: flex; align-items: center; justify-content: center; font: 700 30px "Barlow Condensed", sans-serif; color: var(--muted); }
  .tcard div { font-weight: 600; }
  .tcard .cap { font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .tcard ul { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; font-weight: 400; color: var(--ink); }
  .tcard li { padding: 3px 0; border-top: 1px dashed var(--line); }
  .tcard .pts { margin-top: 10px; font: 700 22px "Barlow Condensed", sans-serif; color: var(--accent); }
  .tcard .pts small { font: 600 11px Inter, sans-serif; letter-spacing: .08em; color: var(--muted); margin-left: 4px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; margin-top: 8px; background: var(--win-soft); color: var(--win); }
  .badge.reg { background: var(--accent-soft); color: var(--accent); }
  .ptable td.n { width: 90px; font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .rise { font-family: "Barlow Condensed", sans-serif; letter-spacing: .02em; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 16px 32px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Practical Basketball · Roblox</div>
    <h1 id="league">ON THE RISE: PB CIRCUIT</h1>
    <div class="meta"><span class="pill" id="stage">Loading</span><span id="tname"></span><span id="updated"></span></div>
    <nav id="tabs"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<footer>ON THE RISE: PB CIRCUIT · updates automatically from the circuit's Discord bot every minute.</footer>

<script>
const STAGES = { signups: "Entries open", swiss: "Swiss stage", swiss_done: "Swiss stage finished",
  groups: "Group stage", groups_done: "Group stage finished", main: "Main draw", done: "Tournament complete" };
let tab = null;
try { tab = localStorage.getItem("pbl-tab"); } catch (e) {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tbd = s => /^(Winner|Loser) of M\d+$/.test(s);
let LOGOS = {};
const initials = n => String(n).split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
function logo(name) {
  if (!name || tbd(name) || name === "BYE") return "";
  const src = LOGOS[name];
  return src ? `<img class="lg" src="${esc(src)}" alt="" loading="lazy">` : `<span class="lg ph">${esc(initials(name))}</span>`;
}
const team = name => `<span class="tn">${logo(name)}<span class="nm">${esc(name)}</span></span>`;

function matchCard(m) {
  if (m.bye) {
    const who = m.a === "BYE" ? m.b : m.a;
    return `<div class="match"><div class="id"><span>M${m.id}</span></div><div class="bye">${esc(who)} advances (bye)</div></div>`;
  }
  const [wa, wb] = m.score ? m.score.split("-") : ["", ""];
  const row = (name, side) => {
    const won = m.winner && m.winner === name, lost = m.winner && !won;
    const pts = m.score ? (won ? wa : wb) : "";
    return `<div class="row ${won ? "w" : lost ? "l" : ""} ${tbd(name) ? "tbd" : ""}"><span class="t">${logo(name)}<span class="nm">${esc(name)}</span></span><span class="s">${esc(pts)}</span></div>`;
  };
  return `<div class="match ${m.ready ? "ready" : ""}"><div class="id"><span>M${m.id}</span>${m.ready ? "<b>Play now</b>" : ""}</div>${row(m.a, "a")}${row(m.b, "b")}</div>`;
}

function bracket(matches, test) {
  const cols = [];
  for (const m of matches.filter(x => test(x.label))) {
    let c = cols.find(c => c.label === m.label);
    if (!c) cols.push(c = { label: m.label, items: [] });
    c.items.push(m);
  }
  if (!cols.length) return "";
  return `<div class="bracket">${cols.map(c => `<div class="col"><h3>${esc(c.label)}</h3>${c.items.map(matchCard).join("")}</div>`).join("")}</div>`;
}

function mainView(d) {
  if (!d.main) return `<div class="empty">The main draw hasn't started yet. It's always double elimination: lose twice and you're out.</div>`;
  const ms = d.main.matches;
  return `<h2>Winners bracket</h2>${bracket(ms, l => l.startsWith("Winners"))}
    <h2>Losers bracket</h2><p class="note">One loss drops you here. A second loss and you're out.</p>${bracket(ms, l => l.startsWith("Losers")) || '<div class="empty">Starts after the first Winners round.</div>'}
    <h2>Grand Final</h2><p class="note">If the Losers bracket team wins, the bracket resets for one deciding game.</p>${bracket(ms, l => l.startsWith("Grand"))}`;
}

function game(m) {
  const res = m.winner
    ? `<span class="who"><b>${esc(m.winner)}</b> beat ${esc(m.winner === m.a ? m.b : m.a)}${m.score ? " " + esc(m.score) : ""}</span>`
    : `<span class="who">${esc(m.a)} vs ${esc(m.b)}</span>`;
  return `<div class="game">${res}<span class="id">M${m.id}</span></div>`;
}

function swissView(sw) {
  const rows = sw.table.map(r => `<tr><td>${team(r.team)}${r.status === "qualified" ? '<span class="tag q">Qualified</span>' : r.status === "out" ? '<span class="tag o">Out</span>' : ""}</td><td class="n">${r.w}-${r.l}</td></tr>`).join("");
  const rounds = [...new Set(sw.matches.map(m => m.round))].sort((a, b) => b - a);
  return `<h2>Swiss stage</h2><p class="note">${sw.wins} wins to make the main draw, ${sw.losses} losses and you're out. Round ${sw.round}.</p>
    <div class="grid"><div class="card"><h3>Standings</h3><table><tr><th>Team</th><th class="n">W-L</th></tr>${rows}</table></div></div>
    <h2>Rounds</h2><div class="rounds">${rounds.map(r => `<div class="card"><h3>Round ${r}</h3><div class="games">${sw.matches.filter(m => m.round === r).map(game).join("")}</div></div>`).join("")}</div>`;
}

function groupsView(gr) {
  return `<h2>Group stage</h2><p class="note">Top ${gr.advance} in each group go to the main draw. Tiebreakers: wins, head-to-head, point difference.</p>
    <div class="grid">${gr.list.map(g => `<div class="card"><h3>${esc(g.name)}</h3>
      <table><tr><th>Team</th><th class="n">W-L</th><th class="n">PD</th></tr>
      ${g.table.map(r => `<tr><td>${team(r.team)}${r.qualified ? '<span class="tag q">Q</span>' : ""}</td><td class="n">${r.w}-${r.l}</td><td class="n">${r.pd > 0 ? "+" : ""}${r.pd}</td></tr>`).join("")}</table>
      <div class="games">${g.matches.map(game).join("")}</div></div>`).join("")}</div>`;
}

function teamsView(d) {
  if (!d.teams.length) return '<h2>Teams</h2><div class="empty">No complete rosters yet. Teams show up here once they have 5 players.</div>';
  return `<h2>Teams</h2><p class="note">Complete rosters only (5+ players).</p><div class="tgrid">${d.teams.map(t => `<div class="tcard">
    ${t.logo ? `<img src="${esc(t.logo)}" alt="${esc(t.name)} logo" loading="lazy">` : `<span class="big">${esc(initials(t.name))}</span>`}
    <div>${esc(t.name)}</div><div class="cap">Captain: ${esc(t.captain)}</div>
    <ul>${(t.players || []).map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    <div class="pts">${t.points}<small>RISER POINTS</small></div>
    ${t.qualified ? '<span class="badge">Major qualified</span> ' : ""}${t.registered && d.tourney ? `<span class="badge reg">In ${esc(d.tourney.name)}</span>` : ""}
  </div>`).join("")}</div>`;
}

function pointsView(d) {
  const c = d.circuit || { standings: [] };
  const need = c.needed;
  const top = Math.max(need || 0, ...c.standings.map(r => r.points), 1);
  let html = `<h2 class="rise">RISER POINTS</h2><p class="note">${need != null ? `<b>${need}</b> points to qualify for the Major. ` : ""}Tournament winners qualify automatically. Points reset to 0 after every Major.</p>`;
  if (d.tourney && d.tourney.points) html += `<p class="note"><b>${esc(d.tourney.name)}</b> pays: ${esc(d.tourney.points)}</p>`;
  if (!c.standings.length) return html + '<div class="empty">No complete teams yet.</div>';
  html += `<div class="card"><table class="ptable"><tr><th>#</th><th>Team</th><th class="n">Points</th></tr>${c.standings.map((r, i) => `<tr><td style="width:32px">${i + 1}</td><td>${team(r.team)}${r.qualified ? '<span class="tag q">Major</span>' : ""}<div class="bar"><span style="width:${Math.min(100, r.points / top * 100)}%"></span></div></td><td class="n">${r.points}${need != null && !r.qualified ? `<div class="note" style="margin:0;font-weight:400">${Math.max(0, need - r.points)} to go</div>` : ""}</td></tr>`).join("")}</table></div>`;
  return html;
}

function render() {
  const d = window.PBL_DATA;
  const view = document.getElementById("view");
  if (!d) { view.innerHTML = '<div class="empty">No circuit data yet. Staff can run /website in Discord.</div>'; return; }
  LOGOS = {};
  (d.teams || []).forEach(t => { if (t && t.logo) LOGOS[t.name] = t.logo; });
  document.getElementById("league").textContent = d.league || "ON THE RISE: PB CIRCUIT";
  document.title = d.league || "ON THE RISE: PB CIRCUIT";
  document.getElementById("tname").textContent = d.tourney ? d.tourney.name + (d.tourney.kind === "major" ? " · MAJOR" : "") : "";
  document.getElementById("stage").textContent = STAGES[d.stage] || "Between tournaments";
  document.getElementById("updated").textContent = d.updated ? "Updated " + new Date(d.updated).toLocaleString() : "";

  const tabs = [["main", "Main draw"]];
  if (d.swiss) tabs.push(["qual", "Swiss stage"]);
  if (d.groups) tabs.push(["qual", "Groups"]);
  tabs.push(["points", "RISER POINTS"]);
  tabs.push(["teams", "Teams"]);
  if (!tabs.some(t => t[0] === tab)) tab = d.main ? "main" : (d.swiss || d.groups) ? "qual" : "points";
  document.getElementById("tabs").innerHTML = tabs.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-k="${k}">${l}</button>`).join("");

  let html = d.champion ? `<div class="champ">${LOGOS[d.champion] ? `<img src="${esc(LOGOS[d.champion])}" alt="">` : ""}<span><small>Champions</small><div>${esc(d.champion)}</div></span></div>` : "";
  if (tab === "main") html += mainView(d);
  else if (tab === "qual") html += d.swiss ? swissView(d.swiss) : groupsView(d.groups);
  else if (tab === "points") html += pointsView(d);
  else html += teamsView(d);
  view.innerHTML = html;
}

document.getElementById("tabs").addEventListener("click", e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k) return;
  tab = k;
  try { localStorage.setItem("pbl-tab", k); } catch (err) {}
  render();
});

function load() {
  const s = document.createElement("script");
  s.src = "data.js?t=" + Date.now();
  s.onload = () => { render(); s.remove(); };
  s.onerror = () => { render(); s.remove(); };
  document.head.appendChild(s);
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
